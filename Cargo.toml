[package]
name = "notepad-rs"
version = "0.1.0"
edition = "2021"
description = "Reconstruction native (Rust + egui) des comportements observes de Notepad"
license = "MIT"

[dependencies]
eframe = "0.37"
egui-phosphor = "0.14"
encoding_rs = "0.8"
ttf-parser = "0.25"
rfd = "0.17"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
genpdf = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
